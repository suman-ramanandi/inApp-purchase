version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Patch and minor updates of dev tooling arrive as one PR; majors stay separate.
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # typescript-eslint supports TypeScript <6.1 (see docs/adr/001-technology-stack.md).
      - dependency-name: typescript
        versions: ['>=6.1.0']
      # Type definitions must match the Node.js major in .nvmrc.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
